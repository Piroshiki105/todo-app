<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TODO</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
  form { display: flex; gap: .5rem; }
  input[type=text] { flex: 1; padding: .5rem; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: center; gap: .5rem; padding: .4rem 0; border-bottom: 1px solid #ddd; }
  li.done span { text-decoration: line-through; color: #888; }
  li span { flex: 1; }
</style>
</head>
<body>
<h1>TODO</h1>
<form id="form">
  <input type="text" id="title" placeholder="やること" required maxlength="200">
  <button>追加</button>
</form>
<ul id="list"></ul>
<script>
const list = document.getElementById('list');

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error(await res.text());
  return res.status === 204 ? null : res.json();
}

async function load() {
  const todos = await api('/api/todos');
  list.replaceChildren(...todos.map(render));
}

function render(t) {
  const li = document.createElement('li');
  if (t.done) li.className = 'done';
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = t.done;
  cb.onchange = async () => {
    await api('/api/todos/' + t.id, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({done: cb.checked}),
    });
    load();
  };
  const span = document.createElement('span');
  span.textContent = t.title; // textContent で XSS を避ける
  const del = document.createElement('button');
  del.textContent = '削除';
  del.onclick = async () => { await api('/api/todos/' + t.id, {method: 'DELETE'}); load(); };
  li.append(cb, span, del);
  return li;
}

document.getElementById('form').onsubmit = async (e) => {
  e.preventDefault();
  const input = document.getElementById('title');
  await api('/api/todos', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({title: input.value}),
  });
  input.value = '';
  load();
};

load().catch(err => alert(err.message));
</script>
</body>
</html>
